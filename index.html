<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gestor Web UNMSM Chilca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { sanmarcos: { red: '#730000', dark: '#4A0000' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-[Inter]">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-sanmarcos-red rounded-full mx-auto flex items-center justify-center text-white font-bold text-2xl shadow-lg mb-4">SM</div>
            <h2 class="text-2xl font-bold text-gray-900">Gestor Institucional</h2>
            <p class="text-gray-500 text-sm">UNMSM - Filial Chilca</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-sanmarcos-red focus:border-sanmarcos-red outline-none transition" placeholder="admin@unmsm.edu.pe">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="loginPassword" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-sanmarcos-red focus:border-sanmarcos-red outline-none transition" placeholder="••••••••">
            </div>
            <button id="btnLogin" class="w-full bg-sanmarcos-red hover:bg-sanmarcos-dark text-white font-bold py-3 rounded-lg shadow-md transition-all mt-4">
                Ingresar al Panel
            </button>
        </div>
    </div>

    <!-- Script rápido solo para el login -->
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
        // REEMPLAZA CON TUS CREDENCIALES AQUI TAMBIEN PARA EL LOGIN
        const supabase = createClient("https://mozvgbodcknmmmbvplft.supabase.co", "sb_publishable_QUpdX5VFX6VusQTN-MgjTQ_F2XhxKFs");

        // Si ya hay sesión, ir al admin
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = "admin.html";
        });

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = "Verificando...";
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Error: " + error.message);
                btn.innerHTML = "Ingresar al Panel";
            } else {
                window.location.href = "admin.html";
            }
        });
    </script>
</body>
</html>
